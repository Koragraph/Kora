# Kora workspace. koragent/ and services/ are separate projects with their own lockfiles and are not listed here.
packages:
  - apps/*
  - packages/*
  - scripts

# Versions shared by several workspaces ("catalog:" in their package.json).
catalog:
  # Effect 4 (release candidate; the runtime, contracts and client all use it)
  effect: 4.0.0-rc.112
  "@effect/atom-react": 4.0.0-rc.112
  "@effect/platform-node": 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  "@effect/tsgo": 0.41.0
  # Build and test toolchain
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  "@types/node": 26.6.5
  tailwindcss: 4.3.3
  "@tailwindcss/node": 4.3.3
  "@tailwindcss/oxide": 4.3.3
  "@tailwindcss/vite": 4.3.3
  lightningcss: 1.33.0
  # UI and utilities
  "@legendapp/list": 3.3.5
  "@pierre/diffs": 1.3.0-beta.10
  "@noble/hashes": 1.8.0
  yaml: ^2.9.0

overrides:
  # --- Security floors: dependencies that ship inside the app ---------------------------------------------------
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2 # updater, Claude agent SDK
  "fast-uri@>=3.0.0 <3.1.8": ^3.1.8
  seroval: ^1.6.9 # via @tanstack/router-core: thenable deserialization
  seroval-plugins: ^1.6.9
  "@modelcontextprotocol/sdk": ^1.32.1 # OAuth redirect validation
  "brace-expansion@<1.1.21": 1.1.21 # DoS-class (via exceljs)
  "brace-expansion@>=2.0.0 <2.1.7": ^2.1.7
  "smol-toml@<1.8.1": ^1.8.1 # the runtime's TOML parser
  "undici@>=7.0.0 <7.29.1": ^7.29.1 # Electron's build-time download helper
  # --- One copy of each: the catalog wins everywhere it appears in the tree ------------------------------------
  effect: "catalog:"
  "@effect/atom-react": "catalog:"
  "@effect/platform-node": "catalog:"
  "@effect/vitest": "catalog:"
  vite: "catalog:"
  yaml: "catalog:"
  "@types/node": "catalog:"
  # lightningcss carries a binary per platform; drifting tailwind ranges would pull a second set.
  tailwindcss: "catalog:"
  "@tailwindcss/node": "catalog:"
  "@tailwindcss/oxide": "catalog:"
  "@tailwindcss/vite": "catalog:"
  lightningcss: "catalog:"
  # --- Pins ---------------------------------------------------------------------------------------------------
  node-abi: 4.33.0
  "@pierre/diffs>@shikijs/transformers": ^4.2.0
  # @effect/vitest resolves its peer `vitest` to the runner vite-plus brings; no separate install.
  "@effect/vitest>vitest": "-"

# Fixes to dependencies, each commented "kora:" inside the patch.
patchedDependencies:
  effect@4.0.0-rc.112: patches/effect@4.0.0-rc.112.patch
  "@legendapp/list@3.3.5": patches/@legendapp__list@3.3.5.patch
  "@pierre/diffs@1.3.0-beta.10": patches/@pierre__diffs@1.3.0-beta.10.patch

packageExtensions:
  vite-plus@*: { dependencies: { vite: "catalog:" } }
  "@effect/vitest@*":
    {
      dependencies: { vite-plus: "catalog:" },
      peerDependenciesMeta: { vitest: { optional: true } },
    }

peerDependencyRules:
  allowAny: [vite]
  allowedVersions:
    vite: "*"

# Install scripts that may run (pnpm 11). Native modules the app needs build; everything else stays inert.
allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  msgpackr-extract: true
  node-pty: true
  sharp: true
  utf-8-validate: false # optional ws speedups
  bufferutil: false
  core-js: false # postinstall banner only
  electron-winstaller: false # Windows installer, not built here
  browser-tabs-lock: false
  workerd: false # test/dev-only
  msw: false

# Pinned releases newer than pnpm's minimum release age (each reviewed when pinned).
minimumReleaseAgeExclude:
  - effect@4.0.0-rc.112
  - "@effect/atom-react@4.0.0-rc.112"
  - "@effect/platform-node@4.0.0-rc.112"
  - "@effect/vitest@4.0.0-rc.112"
  - "@legendapp/list@3.3.5"
  - electron@44.1.0
  - "@anthropic-ai/claude-agent-sdk@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-linux-x64@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.286"
  - "@anthropic-ai/claude-agent-sdk-win32-x64@0.3.286"

# Native packages for this machine only.
supportedArchitectures:
  cpu: [current]
  os: [current]
