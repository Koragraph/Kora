name: Idea or request
description: Something Kora could do, or do better.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Sketches and examples from other tools welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
